<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 820" width="1280" height="820" font-family="Nunito, 'Segoe UI', system-ui, sans-serif">
  <title>Архитектура «Местечка»</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#80868f"/>
    </marker>
    <style>
      .zone { fill: #ffffff; stroke: #e2e4e9; stroke-width: 1.5; }
      .zone-title { font-size: 15px; font-weight: 800; fill: #5d6370; letter-spacing: .06em; }
      .box { fill: #f4f5f7; stroke: #e2e4e9; stroke-width: 1.2; }
      .accent { fill: #ffeadc; stroke: #ff6a13; stroke-width: 1.5; }
      .dark { fill: #22242a; }
      .name { font-size: 16px; font-weight: 800; fill: #22242a; }
      .note { font-size: 13px; fill: #5d6370; }
      .light { fill: #ffffff; }
      .line { stroke: #80868f; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
      .dash { stroke-dasharray: 5 4; }
    </style>
  </defs>
  <rect width="1280" height="820" fill="#f4f5f7"/>

  <!-- Channels -->
  <rect class="zone" x="24" y="24" width="230" height="772" rx="18"/>
  <text class="zone-title" x="44" y="56">КАНАЛЫ</text>
  <rect class="box" x="44" y="76" width="190" height="88" rx="12"/>
  <text class="name" x="60" y="104">Telegram</text>
  <text class="note" x="60" y="126">Mini App клиента</text>
  <text class="note" x="60" y="146">бот с напоминаниями</text>
  <rect class="box" x="44" y="180" width="190" height="68" rx="12"/>
  <text class="name" x="60" y="208">MAX</text>
  <text class="note" x="60" y="230">тот же бот, свой адаптер</text>
  <rect class="box" x="44" y="264" width="190" height="88" rx="12"/>
  <text class="name" x="60" y="292">Сайт заведения</text>
  <text class="note" x="60" y="314">виджет: iframe и</text>
  <text class="note" x="60" y="334">Shadow DOM</text>
  <rect class="box" x="44" y="368" width="190" height="88" rx="12"/>
  <text class="name" x="60" y="396">Кабинет</text>
  <text class="note" x="60" y="418">владелец, администратор,</text>
  <text class="note" x="60" y="438">мастер</text>
  <rect class="box" x="44" y="472" width="190" height="68" rx="12"/>
  <text class="name" x="60" y="500">Сайт продукта</text>
  <text class="note" x="60" y="522">демо и тарифы</text>

  <!-- Edge -->
  <rect class="accent" x="290" y="76" width="96" height="464" rx="16"/>
  <text class="name" x="338" y="292" text-anchor="middle">Caddy</text>
  <text class="note" x="338" y="314" text-anchor="middle">TLS</text>
  <text class="note" x="338" y="334" text-anchor="middle">/api</text>

  <path class="line" d="M234 120 H288"/>
  <path class="line" d="M234 308 H288"/>
  <path class="line" d="M234 412 H288"/>
  <path class="line" d="M234 506 H288"/>

  <!-- Applications -->
  <rect class="zone" x="420" y="24" width="500" height="560" rx="18"/>
  <text class="zone-title" x="440" y="56">ПРИЛОЖЕНИЯ</text>
  <rect class="box" x="440" y="76" width="226" height="56" rx="12"/>
  <text class="name" x="456" y="100">Mini App</text>
  <text class="note" x="456" y="120">React 19, Vite, @tma.js</text>
  <rect class="box" x="676" y="76" width="226" height="56" rx="12"/>
  <text class="name" x="692" y="100">Кабинет</text>
  <text class="note" x="692" y="120">React 19, Vite, Base UI</text>
  <rect class="box" x="440" y="142" width="226" height="56" rx="12"/>
  <text class="name" x="456" y="166">Виджет</text>
  <text class="note" x="456" y="186">widget.js + форма записи</text>
  <rect class="box" x="676" y="142" width="226" height="56" rx="12"/>
  <text class="name" x="692" y="166">Сайт продукта</text>
  <text class="note" x="692" y="186">пререндер, гидратация</text>

  <rect class="accent" x="440" y="216" width="462" height="352" rx="14"/>
  <text class="name" x="456" y="244">API — NestJS 12 на Fastify</text>
  <text class="note" x="456" y="266">контракты Zod → типы, валидация, OpenAPI</text>
  <g font-size="13" font-weight="700" fill="#22242a">
    <rect class="light" x="456" y="282" width="102" height="30" rx="8"/><text x="507" y="302" text-anchor="middle">booking</text>
    <rect class="light" x="566" y="282" width="102" height="30" rx="8"/><text x="617" y="302" text-anchor="middle">scheduling</text>
    <rect class="light" x="676" y="282" width="102" height="30" rx="8"/><text x="727" y="302" text-anchor="middle">catalog</text>
    <rect class="light" x="786" y="282" width="102" height="30" rx="8"/><text x="837" y="302" text-anchor="middle">clients</text>
    <rect class="light" x="456" y="320" width="102" height="30" rx="8"/><text x="507" y="340" text-anchor="middle">payments</text>
    <rect class="light" x="566" y="320" width="102" height="30" rx="8"/><text x="617" y="340" text-anchor="middle">loyalty</text>
    <rect class="light" x="676" y="320" width="102" height="30" rx="8"/><text x="727" y="340" text-anchor="middle">waitlist</text>
    <rect class="light" x="786" y="320" width="102" height="30" rx="8"/><text x="837" y="340" text-anchor="middle">reports</text>
    <rect class="light" x="456" y="358" width="102" height="30" rx="8"/><text x="507" y="378" text-anchor="middle">notifications</text>
    <rect class="light" x="566" y="358" width="102" height="30" rx="8"/><text x="617" y="378" text-anchor="middle">messaging</text>
    <rect class="light" x="676" y="358" width="102" height="30" rx="8"/><text x="727" y="378" text-anchor="middle">identity</text>
    <rect class="light" x="786" y="358" width="102" height="30" rx="8"/><text x="837" y="378" text-anchor="middle">tenancy</text>
  </g>
  <rect class="dark" x="456" y="404" width="432" height="72" rx="12"/>
  <text class="name light" x="472" y="432">packages/domain — чистый домен</text>
  <text class="note" x="472" y="456" fill="#c9ccd3" style="fill:#c9ccd3">доступность, графики, календарь, вертикали, правила</text>
  <text class="note" x="456" y="504">api → application → порты ← infrastructure</text>
  <text class="note" x="456" y="526">роли процесса: api · worker · bot</text>
  <text class="note" x="456" y="548">корень композиции, реакции через очередь</text>

  <path class="line" d="M386 104 H438"/>
  <path class="line" d="M386 170 H438"/>
  <path class="line" d="M386 390 H438"/>

  <!-- Processes -->
  <rect class="zone" x="420" y="604" width="500" height="192" rx="18"/>
  <text class="zone-title" x="440" y="636">ФОНОВЫЕ ПРОЦЕССЫ — ТОТ ЖЕ ОБРАЗ</text>
  <rect class="box" x="440" y="652" width="148" height="124" rx="12"/>
  <text class="name" x="456" y="680">worker</text>
  <text class="note" x="456" y="702">BullMQ: доставка,</text>
  <text class="note" x="456" y="722">напоминания,</text>
  <text class="note" x="456" y="742">удержания, возвраты</text>
  <rect class="box" x="598" y="652" width="148" height="124" rx="12"/>
  <text class="name" x="614" y="680">bot</text>
  <text class="note" x="614" y="702">вебхук Telegram,</text>
  <text class="note" x="614" y="722">обновления MAX</text>
  <rect class="box" x="756" y="652" width="146" height="124" rx="12"/>
  <text class="name" x="772" y="680">demo-reset</text>
  <text class="note" x="772" y="702">ночной сброс</text>
  <text class="note" x="772" y="722">демо-данных</text>

  <!-- Data -->
  <rect class="zone" x="956" y="24" width="300" height="380" rx="18"/>
  <text class="zone-title" x="976" y="56">ДАННЫЕ</text>
  <rect class="box" x="976" y="76" width="260" height="138" rx="12"/>
  <text class="name" x="992" y="104">PostgreSQL 18</text>
  <text class="note" x="992" y="126">RLS по бизнесу, составные ключи</text>
  <text class="note" x="992" y="146">EXCLUDE USING gist:</text>
  <text class="note" x="992" y="166">двойная бронь невозможна</text>
  <text class="note" x="992" y="186">outbox уведомлений</text>
  <rect class="box" x="976" y="226" width="260" height="96" rx="12"/>
  <text class="name" x="992" y="254">Redis 8</text>
  <text class="note" x="992" y="276">очереди BullMQ, дедупликация</text>
  <text class="note" x="992" y="296">обновлений, лимиты</text>
  <rect class="box" x="976" y="334" width="260" height="54" rx="12"/>
  <text class="name" x="992" y="358">Бэкапы</text>
  <text class="note" x="1060" y="358">pg_dump каждую ночь</text>

  <path class="line" d="M902 250 H936 V145 H974"/>
  <path class="line" d="M902 288 H974"/>
  <path class="line" d="M902 480 H936 V508 H974"/>
  <path class="line" d="M920 660 H946 V306 H974"/>

  <!-- External -->
  <rect class="zone" x="956" y="428" width="300" height="368" rx="18"/>
  <text class="zone-title" x="976" y="460">ВНЕШНИЕ СЕРВИСЫ</text>
  <rect class="box" x="976" y="480" width="260" height="56" rx="12"/>
  <text class="name" x="992" y="504">Telegram Bot API</text>
  <text class="note" x="992" y="524">сообщения, вебхук</text>
  <rect class="box" x="976" y="546" width="260" height="56" rx="12"/>
  <text class="name" x="992" y="570">MAX Bot API</text>
  <text class="note" x="992" y="590">в демо — встроенный эмулятор</text>
  <rect class="box" x="976" y="612" width="260" height="56" rx="12"/>
  <text class="name" x="992" y="636">Платёжный провайдер</text>
  <text class="note" x="992" y="656">в демо — тестовая касса</text>
  <rect class="box" x="976" y="678" width="260" height="56" rx="12"/>
  <text class="name" x="992" y="702">isdayoff.ru</text>
  <text class="note" x="992" y="722">производственный календарь</text>

  <path class="line" d="M920 706 H974"/>
</svg>
