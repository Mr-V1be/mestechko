name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Gates, unit tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Quality gate (limits, tokens, format, lint, typecheck, contracts, unit tests)
        run: pnpm gate
      - name: Production build
        run: pnpm build

  integration:
    name: Integration tests (PostgreSQL, Redis)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: mestechko
          POSTGRES_USER: mestechko
          POSTGRES_PASSWORD: ci-postgres-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U mestechko -d mestechko"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:8.10.2-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_ADMIN_URL: postgres://mestechko:ci-postgres-password@127.0.0.1:5432/mestechko
      DATABASE_URL: postgres://mestechko_app:ci-app-password@127.0.0.1:5432/mestechko
      REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Provision role and migrate
        run: pnpm db:provision && pnpm db:migrate
      - name: Database types match the schema
        run: pnpm db:codegen --verify
      - name: Integration tests
        run: pnpm test:integration
      - name: Demo seed runs end to end
        run: pnpm db:seed
