name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Gates, unit tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Quality gate (limits, tokens, translations, format, lint, typecheck, contracts, unit tests)
        run: pnpm gate
      - name: Production build
        run: pnpm build

  integration:
    name: Integration tests (PostgreSQL, Redis)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: slotwise
          POSTGRES_USER: slotwise
          POSTGRES_PASSWORD: ci-postgres-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U slotwise -d slotwise"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:8.10.2-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_ADMIN_URL: postgres://slotwise:ci-postgres-password@127.0.0.1:5432/slotwise
      DATABASE_URL: postgres://slotwise_app:ci-app-password@127.0.0.1:5432/slotwise
      REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Provision role and migrate
        run: pnpm db:provision && pnpm db:migrate
      - name: Database types match the schema
        run: pnpm db:codegen --verify
      - name: Integration tests
        run: pnpm test:integration
      - name: Demo seed runs end to end
        run: pnpm db:seed

  images:
    name: Production images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Compose file of the production stack is valid
        run: |
          sed -E 's/^([A-Z_]+)=$/\1=ci-placeholder/' .env.production.example > "$RUNNER_TEMP/ci.env"
          docker compose --env-file "$RUNNER_TEMP/ci.env" -f docker-compose.prod.yml --profile demo config --quiet
      - name: API image (api, worker, bot, migrations, demo reset)
        run: docker build -f deploy/docker/api.Dockerfile -t slotwise/api:ci .
      - name: Web images
        run: |
          for app in landing cabinet miniapp widget; do
            docker build -f deploy/docker/web.Dockerfile --build-arg APP="$app" -t "slotwise/$app:ci" .
          done
      - name: Edge image
        run: docker build -f deploy/docker/edge.Dockerfile -t slotwise/edge:ci .
