name: mestechko

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: mestechko
      POSTGRES_USER: mestechko
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run `pnpm env:init` to create .env}
    command:
      - postgres
      - -c
      - max_connections=60
      - -c
      - shared_buffers=128MB
    ports:
      - '127.0.0.1:46201:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mestechko -d mestechko']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:8.10.2-alpine
    # BullMQ needs `noeviction`: evicting job keys would silently lose work.
    command:
      - redis-server
      - --appendonly
      - 'yes'
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - noeviction
      - --requirepass
      - ${REDIS_PASSWORD:?Run `pnpm env:init` to create .env}
    ports:
      - '127.0.0.1:46202:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" --no-auth-warning ping | grep PONG']
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:

networks:
  default:
    # Explicit small subnet: the host's automatic address pools are exhausted.
    ipam:
      config:
        - subnet: 10.239.62.0/28
